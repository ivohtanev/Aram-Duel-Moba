<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173f60" />
    <title>Aram Duel — Скрежният мост</title>
  </head>
  <body>
    <canvas id="game" aria-label="Скрежният мост — снежна ARAM карта. WASD или стрелки за движение. Камерата следи героя. Използвай зоната за оглед и бутоните за приближаване."></canvas>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">❖</span><div><strong>ARAM <span>DUEL</span></strong><small>ЛЕДЕНА АРЕНА</small></div></div>
      <nav class="view-switch" aria-label="Изглед на картата">
        <button id="view-overview" aria-pressed="false">Широк изглед</button>
        <button id="view-arena" aria-pressed="true">Близък изглед</button>
      </nav>
      <div class="preview-tag"><i></i> 3.4 · КАМЕРА</div>
    </header>
    <section class="map-caption" aria-label="Карта">
      <div class="eyebrow"><span></span> 01 / ЗАМРЪЗНАЛАТА ПРОПАСТ</div>
      <h1>Скрежният мост</h1>
      <p id="message" role="status">Изграждане на картата…</p>
      <div class="legend"><span><i class="blue-dot"></i>Синя база</span><span><i class="coral-dot"></i>Коралова база</span></div>
    </section>
    <div id="camera-drag-zone" aria-label="Зона за оглед на картата. Задръж и влачи; отпусни за връщане към героя.">
      <span aria-hidden="true">✥</span><strong>Оглед на картата</strong><small>Задръж и влачи · Отпусни за героя</small>
    </div>
    <aside class="camera-tools" aria-label="Управление на камерата">
      <div class="zoom-control"><button id="zoom-out" aria-label="Отдалечи">−</button><output id="zoom-level" aria-label="Приближение">2.0×</output><button id="zoom-in" aria-label="Приближи">+</button></div>
    </aside>
    <div class="orientation">Завърти хоризонтално за по-добър изглед</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
